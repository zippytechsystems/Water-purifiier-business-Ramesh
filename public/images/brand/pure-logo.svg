<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="pureGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="pureShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#pureGrad)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Water Droplet Silhouette -->
  <g filter="url(#pureShadow)">
    <path d="M256 70 C256 70 376 215 376 308 C376 374.27 322.27 428 256 428 C189.73 428 136 374.27 136 308 C136 215 256 70 256 70 Z" fill="url(#pureGrad)" />
    <!-- Droplet Highlight -->
    <path d="M256 100 C256 100 348 220 348 296 C348 318 340 338 326 354 C314 316 284 274 246 250 C216 230 196 212 186 190 C202 152 236 118 256 100 Z" fill="url(#pureGlow)" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M360 120 Q360 150 390 150 Q360 150 360 180 Q360 150 330 150 Q360 150 360 120 Z" fill="#38bdf8" />

  <!-- "PURE" Text in Droplet Center -->
  <text x="256" y="328" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="78" fill="#ffffff" text-anchor="middle" letter-spacing="4">PURE</text>
  <text x="256" y="362" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="22" fill="#bae6fd" text-anchor="middle" letter-spacing="6">AQUAFRESH</text>
</svg>
